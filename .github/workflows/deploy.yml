name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd /root/joanpaneque.com

            PREV=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main

            # Rebuild image only when Docker config changed (code is bind-mounted)
            if git diff --name-only "$PREV" HEAD -- docker/8.4 docker-compose.yml | grep -q .; then
              docker compose up --build -d --remove-orphans
            else
              docker compose up -d --remove-orphans
            fi

            # One exec: install, build, migrate, cache (faster than many round-trips)
            docker compose exec -T joanpaneque.com bash -lc '
              set -e
              chmod -R 775 storage bootstrap/cache
              chown -R sail:sail storage bootstrap/cache
              composer install --no-dev --optimize-autoloader --no-interaction
              npm ci
              npm run build
              php artisan migrate --force
              php artisan config:cache
              php artisan route:cache
              php artisan view:clear
              php artisan queue:restart || true
            '
