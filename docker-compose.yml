services:
    joanpaneque.com:
        build:
            context: ./docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.4/app
        restart: unless-stopped
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - traefik
        depends_on:
            - pgsql
            - redis
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik
            - traefik.http.routers.joanpaneque.rule=Host(`joanpaneque.com`)
            - traefik.http.routers.joanpaneque.entrypoints=websecure
            - traefik.http.routers.joanpaneque.tls.certresolver=le
            - traefik.http.routers.joanpaneque.middlewares=wwwredir
            - traefik.http.services.joanpaneque.loadbalancer.server.port=80
            - traefik.http.middlewares.wwwredir.redirectregex.regex=^https://www\.joanpaneque\.com/(.*)
            - traefik.http.middlewares.wwwredir.redirectregex.replacement=https://joanpaneque.com/$${1}
            - traefik.http.middlewares.wwwredir.redirectregex.permanent=true

    pgsql:
        image: 'postgres:17'
        restart: unless-stopped
        environment:
            POSTGRES_DB: '${DB_DATABASE:-laravel}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'sailpgsql:/var/lib/postgresql/data'
        networks:
            - sail
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sail}"]
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        restart: unless-stopped
        volumes:
            - 'sailredis:/data'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s

networks:
    sail:
        driver: bridge
    traefik:
        external: true

volumes:
    sailpgsql:
        driver: local
    sailredis:
        driver: local
